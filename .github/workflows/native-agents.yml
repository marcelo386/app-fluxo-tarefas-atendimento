# Atendimento nativo: atribui a issue origin:app ao Copilot (coordenador) e publica o andamento.
# Roda sempre a partir da main confiável. Código de PR nunca é executado com credencial:
# o relatório do PR é lido pela API como dado. Ligue com a variável AGENT_RUNTIME=github-native
# e desligue o ensaio com AGENT_DRY_RUN=false (o padrão é ensaio). AUTO_MERGE=true integra o PR
# depois de revisão ok + build verde (padrão false). Retomar um caso: Actions > native-agents >
# Run workflow, informando o número da issue.
name: native-agents

on:
  issues:
    types: [opened, labeled]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_run: # build terminou: o controlador reavalia o PR
    workflows: [build]
    types: [completed]
  push: # merge na main: resposta final e fechamento (também serve de retomada)
    branches: [main]
  workflow_dispatch:
    inputs:
      issue:
        description: Número da issue origin:app para retomar
        required: true

# contents/pull-requests: write só são usados com AUTO_MERGE=true (marcar pronto e integrar sem bypass).
permissions:
  contents: write
  issues: write
  pull-requests: write

# Um de cada vez POR ISSUE: evita atribuir duas vezes e não descarta eventos de outras issues.
concurrency:
  group: native-agents-${{ github.event.issue.number || github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.issue || github.sha }}
  cancel-in-progress: false

jobs:
  controlar:
    runs-on: ubuntu-latest
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'origin:app')
    steps:
      - uses: actions/checkout@v4 # sem "ref": pull_request_target já usa a main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/controlador.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_AGENT_TOKEN: ${{ secrets.COPILOT_AGENT_TOKEN }}
          AGENT_RUNTIME: ${{ vars.AGENT_RUNTIME }}
          AGENT_DRY_RUN: ${{ vars.AGENT_DRY_RUN || 'true' }}
          AUTO_MERGE: ${{ vars.AUTO_MERGE || 'false' }}
